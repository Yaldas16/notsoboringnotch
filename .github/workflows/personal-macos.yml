name: Build Boring Notch Personal

on:
  push:
    branches: ['personal-fork/**']
  workflow_dispatch:
    inputs:
      runner:
        description: Apple Silicon runner image
        type: choice
        options: [macos-26, macos-15]
        default: macos-26

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: ${{ inputs.runner == 'macos-15' && '/Applications/Xcode_26.3.app/Contents/Developer' || '/Applications/Xcode_26.6.app/Contents/Developer' }}
      APP_NAME: Boring Notch Personal
      APP_ID: local.boringnotch.personal
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Resolve packages and build for Apple Silicon
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          xcodebuild -version
          xcodebuild -resolvePackageDependencies -project boringNotch.xcodeproj -scheme boringNotch \
            -derivedDataPath "$RUNNER_TEMP/derived" -onlyUsePackageVersionsFromResolvedFile
          xcodebuild -quiet -project boringNotch.xcodeproj -scheme boringNotch -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/derived" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= build

      - name: Package and verify the extracted app
        run: |
          set -euo pipefail
          trap 'echo "::error::Bundle verification failed at line $LINENO: $BASH_COMMAND"' ERR
          source_app="$RUNNER_TEMP/derived/Build/Products/Release/$APP_NAME.app"
          zip="$RUNNER_TEMP/Boring-Notch-Personal-arm64.zip"
          test -d "$source_app"
          ditto -c -k --sequesterRsrc --keepParent "$source_app" "$zip"
          ditto -x -k "$zip" "$RUNNER_TEMP/verified"

          app="$RUNNER_TEMP/verified/$APP_NAME.app"
          plist="$app/Contents/Info.plist"
          helper="$app/Contents/XPCServices/BoringNotchXPCHelper.xpc"
          framework="$app/Contents/Frameworks/MediaRemoteAdapter.framework"
          media_client="$app/Contents/Resources/MediaRemoteAdapterTestClient"
          read_plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$2"; }

          plutil -lint "$plist" "$helper/Contents/Info.plist"
          test "$(read_plist CFBundleIdentifier "$plist")" = "$APP_ID"
          test "$(read_plist CFBundleDisplayName "$plist")" = "$APP_NAME"
          test "$(read_plist CFBundlePackageType "$plist")" = APPL
          test "$(read_plist CFBundleIdentifier "$helper/Contents/Info.plist")" = "$APP_ID.BoringNotchXPCHelper"
          test -L "$framework/Versions/Current"
          test -f "$app/Contents/Resources/mediaremote-adapter.pl"
          if plutil -p "$plist" | grep -Eq '"(SU[A-Z][^"]*|BNUpdateChannel)"[[:space:]]*=>'; then
            echo "::error::The packaged app includes Sparkle update configuration."
            exit 1
          fi
          test -z "$(find "$app" -name Sparkle.framework -print)"

          executable="$app/Contents/MacOS/$(read_plist CFBundleExecutable "$plist")"
          test "$(lipo -archs "$executable")" = arm64
          for binary in "$helper/Contents/MacOS/BoringNotchXPCHelper" "$framework/MediaRemoteAdapter" "$media_client"; do
            test -x "$binary"
            lipo "$binary" -verify_arch arm64
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --verify --strict --verbose=2 "$media_client"
          for bundle in "$app" "$helper"; do
            signature="$(codesign -dv --verbose=2 "$bundle" 2>&1)"
            grep -q '^Signature=adhoc$' <<< "$signature"
            grep -Eq '^CodeDirectory .*flags=.*runtime' <<< "$signature"
          done
          codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/app-entitlements.plist"
          test "$(read_plist com.apple.security.app-sandbox "$RUNNER_TEMP/app-entitlements.plist")" = true
          codesign -d --entitlements :- "$helper" > "$RUNNER_TEMP/helper-entitlements.plist"
          test "$(read_plist com.apple.security.app-sandbox "$RUNNER_TEMP/helper-entitlements.plist")" = false
          shasum -a 256 "$zip"

      - name: Upload the verified ZIP
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Boring-Notch-Personal-arm64
          path: ${{ runner.temp }}/Boring-Notch-Personal-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Run upstream macOS tests
        run: |
          set -euo pipefail
          xcodebuild -quiet -project boringNotch.xcodeproj -scheme boringNotch -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/derived" \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -parallel-testing-enabled NO \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= test
